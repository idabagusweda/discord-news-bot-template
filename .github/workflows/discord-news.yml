name: Discord News Aggregator

on:
  workflow_dispatch:
  # To enable automated hourly runs, uncomment the schedule block below:
  # schedule:
  #   # Runs every hour at minute 15 (UTC). Scheduled runs may have slight delays depending on GitHub Actions queue.
  #   - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: discord-news-bot
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch feeds and send to Discord
        env:
          DISCORD_GAMING_WEBHOOK: ${{ secrets.DISCORD_GAMING_WEBHOOK }}
          DISCORD_TECH_WEBHOOK: ${{ secrets.DISCORD_TECH_WEBHOOK }}
        run: python bot.py

      - name: Persist sent articles state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/state.json

          if git diff --cached --quiet; then
            echo "No state updates found. Skipping commit."
            exit 0
          fi

          git commit -m "chore(state): update sent article history [skip ci]"
          git pull --rebase -X theirs origin main
          git push origin main
